<!doctype html><html lang="vi"><meta charset="utf-8"><style>body{font:13px Arial;width:260px;padding:10px}input,select,button{width:100%;margin:4px 0;padding:7px;box-sizing:border-box}</style><h3>AI Council V2 Agent</h3><input id="url" placeholder="wss://xxx.hf.space/ws"><input id="room" value="demo"><select id="role"><option value="chatgpt">ChatGPT</option><option value="copilot">Copilot</option></select><button id="save">CONNECT AGENT</button><div id="s">Ready</div><script>const $=i=>document.getElementById(i);chrome.storage.local.get({wsUrl:"",roomId:"demo",role:"chatgpt"}).then(c=>{$("url").value=c.wsUrl;$('room').value=c.roomId;$('role').value=c.role});$('save').onclick=()=>chrome.runtime.sendMessage({type:'CONFIG',config:{enabled:true,wsUrl:$('url').value,roomId:$('room').value,role:$('role').value}},r=>$('s').textContent=r?.ok?'Configured':'Error');</script></html>
