<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Council V2</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1014;color:#eee;font:14px Arial;height:100vh;display:flex;flex-direction:column}header{padding:10px;border-bottom:1px solid #2b3037;display:flex;gap:7px;align-items:center;flex-wrap:wrap}h2{font-size:17px;margin:0 10px 0 0}.wide{flex:1;min-width:230px}input,select,textarea{background:#15191e;color:#fff;border:1px solid #3a4149;border-radius:7px;padding:8px}input{width:70px}.wide input{width:100%}button{background:#292f36;color:#fff;border:0;border-radius:7px;padding:8px 11px}.primary{background:#fff;color:#111}main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#333;flex:1;min-height:0}.p{background:#121519;display:flex;flex-direction:column;min-width:0}.title{padding:9px;border-bottom:1px solid #2b3037;font-weight:bold}.log{overflow:auto;flex:1;padding:10px}.m{background:#1b2026;padding:9px;border-radius:8px;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}.meta{font-size:10px;color:#8e969f;margin-bottom:5px}.send{display:flex;gap:6px;padding:7px;border-top:1px solid #2b3037}.send textarea{flex:1;resize:none;height:52px}footer{padding:7px 10px;border-top:1px solid #2b3037;color:#89919a;font-size:11px;display:flex;justify-content:space-between}@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}</style></head><body><header><h2>AI Council V2</h2><span id="status">OFFLINE</span><span id="roomLabel"></span><div class="wide"><input id="ws" placeholder="wss://YOUR-SPACE.hf.space/ws"></div><input id="room" value="demo"><select id="starter"><option value="chatgpt">ChatGPT</option><option value="copilot">Copilot</option></select><button id="connect" class="primary">CONNECT</button><button id="start">START</button><button id="stop">STOP</button><button id="reset">RESET</button></header><main><section class="p"><div class="title">CHATGPT</div><div id="gpt" class="log"></div><div class="send"><textarea id="gi" placeholder="Gửi thủ công..."></textarea><button data-target="chatgpt">GỬI</button></div></section><section class="p"><div class="title">COPILOT</div><div id="cop" class="log"></div><div class="send"><textarea id="ci" placeholder="Gửi thủ công..."></textarea><button data-target="copilot">GỬI</button></div></section></main><footer><span id="state">Chưa kết nối</span><span>Relay: Hugging Face Space</span></footer><script src="app.js"></script></body></html>
