<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ee4d2d">
  <title>Shopee Video Downloader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="brand"><span class="logo">S</span><div><h1>Shopee Video</h1><p>Tải video từ link Shopee</p></div></div>

      <label for="url">Link Shopee</label>
      <div class="input-row">
        <input id="url" inputmode="url" autocomplete="off" placeholder="https://vn.shp.ee/...">
        <button id="paste" class="secondary">Dán</button>
      </div>
      <button id="resolve" class="primary">LẤY VIDEO</button>

      <div id="status" class="status" role="status"></div>

      <section id="result" class="result hidden">
        <video id="preview" controls playsinline preload="metadata"></video>
        <div class="meta">
          <strong id="title">Shopee video</strong>
          <span id="details"></span>
        </div>
        <a id="download" class="download" download="shopee-video.mp4">TẢI MP4</a>
      </section>
    </section>
    <p class="note">Chỉ tải video khi bạn có quyền sử dụng. Link video có thể hết hạn.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
